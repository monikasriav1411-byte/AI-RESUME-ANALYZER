<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       SESSION GUARD — unchanged from original, must stay inline
       and must stay in <head> so it runs before first paint.
       ============================================================ -->
  <script>
    if (localStorage.getItem("user_session")) {
      window.location.href = "/";
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeDesk — Access Your Portal</title>
  <!-- Google Fonts (unchanged) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/login.css?v=3">
  <!-- Official Google Identity Services SDK (unchanged) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ============================================================
       DECORATIVE LAYER — purely visual, no IDs used by login logic.
       Safe to keep, safe to remove, does not touch auth flow.
       ============================================================ -->

  <!-- Ambient color wash behind everything -->
  <div class="orb orb-blue" aria-hidden="true"></div>
  <div class="orb orb-cyan" aria-hidden="true"></div>
  <div class="orb orb-purple" aria-hidden="true"></div>

  <!-- Floating resume/AI themed icons (populated + animated via login.js + CSS) -->
  <div class="bg-icons" id="bgIcons" aria-hidden="true"></div>

  <!-- Fine data-particle grain -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Premium cursor glow that follows the pointer -->
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- Mouse-trail particle spawn point (particles appended here by login.js) -->
  <div class="particle-field" id="particleField" aria-hidden="true"></div>

  <!-- ============================================================
       FUNCTIONAL LOGIN UI — all original IDs / classes preserved:
       login-container, login-card, login-header, brand-title,
       brand-accent, brand-subtitle, errorBanner, errorMessage,
       googleBtnContainer, googleBtn, googleBtnText, login-footer
       ============================================================ -->
  <div class="login-container">
    <div class="login-card-border">
      <div class="login-card">

        <!-- floating light reflections purely decorative -->
        <span class="card-sheen sheen-1" aria-hidden="true"></span>
        <span class="card-sheen sheen-2" aria-hidden="true"></span>

        <div class="login-header">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#markGrad)" opacity="0.15"/>
              <path d="M16 14h12l6 6v14a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V16a2 2 0 0 1 2-2z" stroke="url(#markGrad)" stroke-width="2" stroke-linejoin="round"/>
              <path d="M28 14v6h6" stroke="url(#markGrad)" stroke-width="2" stroke-linejoin="round"/>
              <path d="M18 25l3.2 3.2L26.5 22" stroke="url(#markGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="markGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3B82F6"/>
                  <stop offset="0.5" stop-color="#22D3EE"/>
                  <stop offset="1" stop-color="#A855F7"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2 class="brand-title">Resume<span class="brand-accent">Desk</span></h2>
          <p class="brand-subtitle">Analyze your resumes &amp; practice mock interviews with Google and Groq AI.</p>
        </div>

        <!-- Action Feedback Banner (unchanged id/logic) -->
        <div class="alert-error" id="errorBanner">
          <svg style="width:18px; height:18px; flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span id="errorMessage">An unexpected error occurred.</span>
        </div>

        <!-- Google Authentication Trigger (unchanged id/logic) -->
        <div id="googleBtnContainer">
          <button id="googleBtn" class="btn-google" type="button">
            <span class="btn-google-glow" aria-hidden="true"></span>
            <span class="google-icon-wrap">
              <!-- Custom Vector Google Icon (unchanged) -->
              <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
            </span>
            <span id="googleBtnText">Continue with Google</span>
            <!-- Decorative nav arrow — gets the blue/cyan/purple hover treatment -->
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="login-footer">
          <p>By signing in, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
        </div>

      </div>
    </div>
  </div>

  <!-- ============================================================
       All JavaScript — original auth logic (untouched) plus the
       new decorative background / cursor / particle effects —
       now lives in js/login.js
       ============================================================ -->
  <script src="/static/js/login.js?v=1" defer></script>
</body>
</html>
