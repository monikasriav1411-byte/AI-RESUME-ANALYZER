<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    if (!localStorage.getItem("user_session")) {
      window.location.href = "/login";
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Analyzer — AI Chat Client</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Link custom chat CSS -->
  <link rel="stylesheet" href="/static/css/chat.css?v=4">
  <!-- Lightweight Markdown Parser via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  
  <div class="app-layout">
    
    <!-- Backdrop for mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Vertical Sidebar (Side Nav) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="brand">
          <span class="brand-text">Resume<span class="brand-accent">Desk</span></span>
        </a>
      </div>

      <div class="sidebar-actions">
        <button id="newChatBtn" class="btn-primary">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>New Chat</span>
        </button>
        <button id="mockInterviewBtn" class="btn-secondary">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
          </svg>
          <span>Mock Interview</span>
        </button>
      </div>

      <!-- Scrollable History Section (Empty for dynamic JS injection) -->
      <div class="sidebar-history">
        <div class="history-label">Recent Chats</div>
        <div class="history-list" id="historyList">
          <!-- Dynamic history list items will be injected here by JavaScript -->
        </div>
      </div>

      <!-- Account/Profile Footer -->
      <div class="sidebar-profile">
        <div class="profile-info">
          <div class="profile-avatar" id="profileAvatar">AM</div>
          <div class="profile-details">
            <span class="profile-name" id="profileName">Alex Morgan</span>
            <span class="profile-status">Premium Plan</span>
          </div>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <button id="settingsBtn" class="btn-icon" title="Account Settings">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
          <button id="logoutBtn" class="btn-icon" title="Sign Out">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Bar / Header -->
      <header class="header">
        <div class="header-left">
          <button id="menuToggle" class="btn-icon btn-menu" title="Open Sidebar">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h1 id="activeChatTitle" class="chat-title">Resume Analyzer</h1>
          <span class="active-tag">AI Active</span>
        </div>
        <!-- Right corner tabs navigation completely removed -->
        <div class="header-right"></div>
      </header>

      <!-- Chat Window (Scroll track will sit on the far right edge of the main content view) -->
      <section class="chat-window" id="chatWindow">
        <!-- Inner container to keep chat bubbles centered inside the scrollable container -->
        <div class="chat-feed-inner" id="chatFeedInner">
          <!-- Messages will be injected here dynamically by JavaScript -->
        </div>
      </section>

      <!-- Sticky Prompt Input Area (Locked to the bottom, centered to match message alignment) -->
      <footer class="input-container" id="inputContainer">
        <form id="chatForm" class="chat-input-form">
          <div class="input-wrapper">
            <!-- Hidden File Input for Attachment -->
            <input type="file" id="attachmentInput" style="display: none;" accept="application/pdf,image/*,text/plain">
            <button type="button" id="attachmentBtn" class="btn-input-action" title="Attach file">
              <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
              </svg>
            </button>
            
            <textarea id="promptInput" rows="1" placeholder="Ask anything about your resume"></textarea>
            
            <button type="submit" id="sendBtn" class="btn-send" title="Send Message">
              <svg class="icon-send" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
              </svg>
            </button>
          </div>
        </form>
      </footer>

    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Settings Modal Overlay -->
  <div id="settingsModal" class="modal-overlay">
    <div class="settings-card">
      <div class="settings-card-header">
        <h2>Account Settings</h2>
        <button id="closeSettingsBtn" class="btn-close-modal" title="Close Settings" type="button">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <div class="settings-card-body">
        <!-- Section 1: User Profile -->
        <div class="settings-section">
          <h3 class="settings-section-title">User Profile</h3>
          <div class="settings-profile-info">
            <div class="settings-avatar" id="settingsAvatar">AM</div>
            <div class="settings-profile-details">
              <h4 id="settingsName">Alex Morgan</h4>
              <p id="settingsEmail">alex.morgan@example.com</p>
              <span class="settings-status-badge">Premium Plan</span>
            </div>
          </div>
        </div>
        
        <!-- Section 2: Preferences -->
        <div class="settings-section">
          <h3 class="settings-section-title">Preferences</h3>
          <div class="settings-option">
            <label for="themeSelect">Color Theme</label>
            <select id="themeSelect" class="settings-select">
              <option value="space-dark">Space Dark (Default)</option>
              <option value="midnight-blue">Midnight Blue</option>
              <option value="emerald-teal">Emerald Teal</option>
            </select>
          </div>
          <div class="settings-option">
            <label for="fontSizeSelect">Text Size</label>
            <select id="fontSizeSelect" class="settings-select">
              <option value="font-normal">Normal</option>
              <option value="font-large">Large</option>
              <option value="font-xlarge">Extra Large</option>
            </select>
          </div>
        </div>
        
        <!-- Section 3: Data Management -->
        <div class="settings-section">
          <h3 class="settings-section-title">Data Management</h3>
          <div class="settings-action-row">
            <button id="btnExportHistory" class="btn-secondary" style="margin-top: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;" type="button">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              Export All Chats (JSON)
            </button>
            <button id="btnDeleteAccount" class="btn-danger" style="margin-top: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;" type="button">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              Delete Account & Data
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/chat.js?v=3"></script>
</body>
</html>
