<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview — Resume Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">Resume <span class="brand-mark">Desk</span></div>
  <nav class="tabs">
    <a href="/">Chat</a>
    <a href="/interview" class="active">Interview</a>
    <a href="/history">History</a>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <h1>Practice before the real thing.</h1>
    <p>Upload your resume again — questions are generated from your actual background, and every answer gets scored.</p>
  </section>

  <section class="card" id="setupCard">
    <h2>Start a mock interview</h2>
    <form id="startInterviewForm">
      <label class="upload-box" id="uploadBox" for="interviewResumeFile">
        <input type="file" id="interviewResumeFile" accept="application/pdf" required />
        <span id="uploadLabel">📄 Click to upload your resume</span>
      </label>
      <label for="jobDescription">Job description (optional)</label>
      <textarea id="jobDescription" placeholder="Paste the job posting here..." rows="4"></textarea>
      <button type="submit" id="startBtn">Start interview</button>
    </form>
  </section>

  <section class="card" id="chatCard" style="display:none;">
    <h2>Mock interview</h2>
    <div id="chatWindow" class="chat-window"></div>

    <div id="answerArea">
      <label for="answerInput">Your answer</label>
      <textarea id="answerInput" placeholder="Type your answer..." rows="4"></textarea>
      <button id="submitAnswerBtn">Submit answer</button>
    </div>

    <div id="afterAnswerArea" style="display:none;">
      <button id="nextQuestionBtn">Next question</button>
      <button id="finishInterviewBtn" class="secondary-btn">Finish &amp; see summary</button>
    </div>
  </section>

  <section class="card" id="summaryCard" style="display:none;">
    <h2>Interview summary</h2>
    <div id="summaryOutput"></div>
  </section>
</main>

<script src="/static/js/utils.js"></script>
<script src="/static/js/interview.js"></script>
</body>
</html>
